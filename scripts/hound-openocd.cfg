# hound-openocd.cfg — AEG-Test HOUND-1011S via direct Pi GPIO SWD (no probe)
#
# Wiring (3 wires, no Pico needed):
#   Pi GPIO24 (pin 18) -> SWDIO pad (MCU pin 1)
#   Pi GPIO25 (pin 22) -> SWCLK pad (MCU pin 32)
#   Pi GND             -> device GND
# Keep leads short (<10 cm). Consider a ~470R series resistor on SWDIO:
# the Pi drives 3.3V and the hound runs from a ~3.0V lithium cell.
#
# Run:  sudo openocd -f hound-openocd.cfg
# Then the Tcl RPC port (6666) is available for radon_ha_poller_gpio.py.
# Needs OpenOCD 0.12+ (Debian bookworm's package is fine).

# linuxgpiod works on any Pi (incl. Pi 5) and needs no peripheral base.
# Old-school alternative: `adapter driver bcm2835gpio` + the right
# `bcm2835gpio peripheral_base` for your Pi model (Zero 2W/Pi3 = 0x3F000000).
adapter driver linuxgpiod
adapter gpio swclk 25 -chip 0
adapter gpio swdio 24 -chip 0

transport select swd
adapter speed 1000

swd newdap hound cpu -enable
dap create hound.dap -chain-position hound.cpu

# IMPORTANT: use a mem_ap target, NOT cortex_m. OpenOCD's cortex_m target
# fails examination on this chip ("Cortex-M CPUID: 0x410cc300 is
# unrecognized") and then refuses all memory reads. mem_ap reads RAM
# straight through the debug access port — no CPU examination, and
# genuinely non-intrusive (the core is never touched, let alone halted).
target create hound.mem mem_ap -dap hound.dap -ap-num 0

init
